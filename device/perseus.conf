# Xiaomi Mi MIX 3 (perseus / SDM845) -- HackiOS device profile
NAME="Xiaomi Mi MIX 3 (perseus)"
KIND=phone
SOC="Qualcomm Snapdragon 845 (SDM845)"

# We keep our own UEFI (edk2-sdm845, pinned e7aac7fc) instead of Mu-Silicium:
# the boot image carries it in the kernel slot and it loads EFI/BOOT/BOOTAA64.EFI
# from the FAT ramdisk, where the HackiOS loader and its payload live.
UEFI_TARGET=perseus
UEFI_FD=
DTB=tools/perseus.dtb
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000

FB_BASE=0x9d400000              # 1080x2340 AMOLED; the loader matches the platform by this
WIFI_ATH11K=0

BOOTARGS="touchscreen=0 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE=""
